<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grace's Training</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grace's Training">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F8F3EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18120C" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f8f3ea;--ink:#2b2016}
@media (prefers-color-scheme:dark){:root{--bg:#18120c;--ink:#f6ecda}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{overflow:hidden}
/* iPhone home screen apps report a window shorter than the screen by the status bar height, so add it back. */
iframe{position:fixed;top:0;left:0;right:0;display:block;width:100%;height:calc(100% + env(safe-area-inset-top));border:0;background:var(--bg)}
noscript{display:block;padding:24px}
</style>
</head>
<body>
<!-- Paste your Apps Script web app URL (ends in /exec) between the quotes below. -->
<iframe id="app" title="Grace's Training Tracker" src="https://script.google.com/macros/s/AKfycbzbN3d6pfJmsOvb5mPSsR6j0CAODZCJ5kWapZPoGsRx0AAQQAhjNy7UM7P1oqXCibCZ/exec" allow="clipboard-write"></iframe>
<noscript><a href="https://script.google.com/macros/s/AKfycbzbN3d6pfJmsOvb5mPSsR6j0CAODZCJ5kWapZPoGsRx0AAQQAhjNy7UM7P1oqXCibCZ/exec">Open Grace's Training Tracker</a></noscript>
</body>
</html>
